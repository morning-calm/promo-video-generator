<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pitchcraft promo</title>
<style>
@font-face { font-family: 'Inter'; src: url('fonts/inter.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Bricolage Grotesque'; src: url('fonts/bricolage.woff2') format('woff2'); font-weight: 200 800; }
@font-face { font-family: 'Instrument Serif'; src: url('fonts/instrument-serif-italic.woff2') format('woff2'); font-weight: 400; font-style: italic; }
@font-face { font-family: 'JetBrains Mono'; src: url('fonts/jetbrains-mono.woff2') format('woff2'); font-weight: 100 800; }
html, body { margin: 0; background: #07051a; overflow: hidden; }
#v { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07051a; font-family: 'Inter', sans-serif; color: #fff; }
#v * { box-sizing: border-box; }
.abs { position: absolute; left: 0; top: 0; }
#bg { position: absolute; inset: 0; }
.persp { perspective: 2400px; perspective-origin: 50% 50%; }
.line { position: absolute; white-space: nowrap; overflow: hidden; line-height: 1.02; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -0.045em; }
.ch { display: inline-block; }
.glass { background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); border: 1.5px solid rgba(255,255,255,.22); backdrop-filter: blur(22px) saturate(1.4); box-shadow: 0 30px 80px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.3); }
.card3d { position: absolute; left: -410px; top: -230px; width: 820px; height: 461px; border-radius: 20px; overflow: hidden; backface-visibility: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1.5px rgba(255,255,255,.18); background: #111; }
.card3d img { width: 100%; height: 100%; display: block; }
.mono { font-family: 'JetBrains Mono', monospace; }
.chip { position: absolute; padding: 0 30px; height: 84px; border-radius: 42px; display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 38px; white-space: nowrap; letter-spacing: -0.01em; }
.chip b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 52px; font-weight: 800; background: linear-gradient(135deg, #ff8f7d, #ffd36e); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
.tile { position: absolute; width: 270px; height: 270px; border-radius: 64px; display: grid; place-items: center; box-shadow: 0 40px 80px -20px rgba(0,0,0,.65), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -10px 30px rgba(0,0,0,.18); }
.lbl { position: absolute; font-weight: 700; font-size: 38px; letter-spacing: -0.01em; text-align: center; width: 400px; }
svg { display: block; overflow: visible; }
</style></head>
<body><div id="v"><canvas id="bg" width="1920" height="1080"></canvas></div>
<script src="../../lib/motion.js"></script>
<script src="promo.js"></script></body></html>
