<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Starter</title>
<link rel="stylesheet" href="../../lib/motion.css">
<style>
/* fonts MUST be bundled with the project (woff2 in ./fonts) - a render that depends on installed fonts is not reproducible */
@font-face { font-family: 'Inter'; src: url('fonts/inter.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Bricolage Grotesque'; src: url('fonts/bricolage.woff2') format('woff2'); font-weight: 200 800; }
#v { background: #090616; font-family: 'Inter', sans-serif; color: #fff; }
#bg { position: absolute; inset: 0; }
.line { font-family: 'Bricolage Grotesque', sans-serif; letter-spacing: -0.045em; }
.card { width: 760px; height: 300px; border-radius: 36px; padding: 44px 52px; }
.card h3 { margin: 0 0 12px; font: 700 54px 'Bricolage Grotesque'; letter-spacing: -0.02em; }
.card p { margin: 0; font-size: 34px; line-height: 1.35; color: rgba(255,255,255,.78); }
.pill { height: 84px; padding: 0 44px; border-radius: 42px; display: flex; align-items: center; font-weight: 700; font-size: 36px; background: linear-gradient(135deg,#ff8f7d,#ffd36e); color: #1a1030; white-space: nowrap; }
</style></head>
<body><div id="v"><canvas id="bg" width="1920" height="1080"></canvas></div>
<script src="../../lib/motion.js"></script>
<script src="scene.js"></script></body></html>
